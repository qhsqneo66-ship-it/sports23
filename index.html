@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0C1630; --surface:#15244A; --ink:#EAF0FF; --muted:#9FB0D6; --line:#25386A;
    --blue:#7FA2FF; --blue-soft:#1E2F5E; --red:#FF7FA3; --red-soft:#46213A;
    --yellow:#FFD84A; --ok:#4FD3A0; --warn:#FFA060;
    --board:#1A3A82; --board-ink:#FFFFFF; --board-deep:#0E2457; --hdr:#15244A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1630; --surface:#15244A; --ink:#EAF0FF; --muted:#9FB0D6; --line:#25386A;
  --blue:#7FA2FF; --blue-soft:#1E2F5E; --red:#FF7FA3; --red-soft:#46213A;
  --yellow:#FFD84A; --ok:#4FD3A0; --warn:#FFA060;
  --board:#1A3A82; --board-ink:#FFFFFF; --board-deep:#0E2457; --hdr:#15244A; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--board)}
.disp{font-family:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-weight:400;letter-spacing:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}

header.top{background:var(--board);color:var(--board-ink);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top-inner{max-width:1100px;margin:0 auto;padding:14px 18px 0}
.title-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.title-row h1{margin:0;font-size:24px}
.sync{font-size:12.5px;opacity:.75}
.grades{display:flex;gap:6px;margin-top:12px}
.grades button{border:0;background:transparent;color:var(--board-ink);opacity:.6;padding:6px 14px;border-radius:6px 6px 0 0;font-size:18px}
.grades button[aria-pressed="true"]{opacity:1;background:var(--bg);color:var(--ink)}
nav.sports{background:var(--bg);border-bottom:1px solid var(--line)}
.sports-inner{max-width:1100px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto}
.sports-inner button{border:0;background:none;padding:12px 12px 10px;border-bottom:3px solid transparent;white-space:nowrap;color:var(--muted);font-weight:500}
.sports-inner button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--yellow)}

main{max-width:1100px;margin:0 auto;padding:18px 18px 60px}
.grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
h2{font-size:17px;margin:0 0 10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:7px 6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:500;color:var(--muted);font-size:12.5px}
td.cls{text-align:left;font-weight:700}
tr.top1 td:first-child{color:var(--yellow);font-weight:700}
.rank{font-family:"Jua",sans-serif;font-size:17px}
.pts{font-weight:700}

.rounds{display:flex;flex-direction:column;gap:14px}
.round h3{font-size:13px;color:var(--muted);font-weight:500;margin:0 0 6px}
.mlist{display:flex;flex-direction:column;gap:6px}
.mcard{display:grid;grid-template-columns:1fr auto 1fr auto;align-items:center;gap:10px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.mcard:hover{border-color:var(--muted)}
.mcard .a{color:var(--blue);font-weight:700}
.mcard .b{color:var(--red);font-weight:700;text-align:right}
.mcard .sc{font-family:"Jua",sans-serif;font-size:20px;min-width:62px;text-align:center}
.mcard .win{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:4px;text-decoration-color:var(--yellow)}
.badge{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.badge.live{border-color:var(--ok);color:var(--ok)}
.badge.done{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* scoring sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;display:none}
.sheet.open{display:block}
.sheet-head{position:sticky;top:0;z-index:2;background:var(--board);color:var(--board-ink);padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;display:flex;align-items:center;gap:12px}
.sheet-head h2{margin:0;font-size:19px;flex:1}
.sheet-head .x{background:transparent;border:1px solid rgba(255,255,255,.35);color:var(--board-ink);border-radius:6px;padding:6px 12px}
.sheet-body{max-width:860px;margin:0 auto;padding:16px 16px 40px}

.board{background:var(--board);color:var(--board-ink);border-radius:12px;padding:16px;display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:stretch}
.side{border-radius:10px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
.side.A{background:color-mix(in srgb,var(--blue) 30%,transparent);box-shadow:inset 0 0 0 2px var(--blue)}
.side.B{background:color-mix(in srgb,var(--red) 28%,transparent);box-shadow:inset 0 0 0 2px var(--red)}
.side .nm{font-size:22px}
.big{font-family:"Jua",sans-serif;font-size:clamp(64px,16vw,112px);line-height:1}
.side .lbl{font-size:12.5px;opacity:.8}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-width:96px}
.clock{font-family:"Jua",sans-serif;font-size:clamp(64px,18vw,104px);line-height:1;color:var(--yellow);font-variant-numeric:tabular-nums;letter-spacing:1px}
.clock.last{color:#FF8A3D}
.clock.over{color:var(--red)}
.timer-panel{background:var(--board);color:var(--board-ink);border-radius:12px;padding:16px;margin-bottom:12px;display:flex;flex-direction:column;align-items:center;gap:10px}
.timer-panel .tl{font-size:13px;opacity:.8}
.tbar{width:100%;max-width:520px;height:8px;border-radius:99px;background:rgba(255,255,255,.15);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--yellow);border-radius:99px}
.tbtns{display:flex;gap:8px}
.tbtns button{touch-action:manipulation;border:0;border-radius:10px;padding:12px 22px;font-size:17px;font-weight:700}
.tbtns .go{background:var(--yellow);color:#14233D}
.tbtns .rs{background:#FFFFFF;color:#14233D}
.tbtns button:active,.endbtn:active{transform:translateY(1px)}
.vs{font-family:"Jua",sans-serif;font-size:28px;opacity:.6;align-self:center}
@media (max-width:560px){.board .vs{display:none}}
body.ro .timer-panel{display:none}
.btn-s{border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--board-ink);border-radius:6px;padding:5px 10px;font-size:13px}
.setscore{font-family:"Jua",sans-serif;font-size:26px}
.counter{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;gap:6px;width:100%;max-width:220px}
.counter button{height:44px;border-radius:8px;border:0;font-size:24px;font-weight:700;background:rgba(255,255,255,.14);color:var(--board-ink)}
.counter button.minus{background:rgba(255,255,255,.92);color:#14233D}
.counter .v{text-align:center}
.counter .v b{font-family:"Jua",sans-serif;font-size:30px;font-weight:400}
.counter .v span{opacity:.75;font-size:14px}
.counter .v small{display:block;font-size:12px;opacity:.75;margin-top:-4px}
.starts{display:flex;gap:6px;align-items:center;font-size:12.5px;opacity:.9;flex-wrap:wrap;justify-content:center}
.starts input{width:46px;padding:3px 4px;border-radius:5px;border:1px solid rgba(255,255,255,.35);background:transparent;color:var(--board-ink);text-align:center}
@media (max-width:560px){
  .board{grid-template-columns:1fr 1fr}
  .center{grid-column:1 / -1;order:-1;flex-direction:row;flex-wrap:wrap}
}
.svlab{font-size:13px;opacity:.85}
.svin{width:100%;max-width:200px;text-align:center;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.45);border-radius:12px;color:var(--board-ink);padding:6px 0;-moz-appearance:textfield;appearance:textfield}
.svin::-webkit-outer-spin-button,.svin::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.svin::placeholder{color:rgba(255,255,255,.4)}
.svin:disabled{border-color:transparent;background:transparent;opacity:1}
body.ro .clock, body.ro .actions, body.ro [data-timer], body.ro .msg.warn, body.ro .g-side button{display:none}
body.ro .g-side{grid-template-columns:1fr}
.preview-bar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--yellow);color:#1A1F26;border-radius:10px;padding:10px 14px;margin-bottom:16px;font-weight:500}
.preview-bar .ghost{border-color:#1A1F26;color:#1A1F26;background:rgba(255,255,255,.5)}
.qr-wrap{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:24px;align-items:start;max-width:860px}
@media (max-width:700px){.qr-wrap{grid-template-columns:1fr}}
.qr-card{text-align:center}
.share-wrap{max-width:420px;margin:0 auto}
.share-wrap .qr-box svg{max-width:340px}
.qr-box{background:#fff;border-radius:8px;padding:8px}
.steps h2{margin-top:22px}.steps h2:first-child{margin-top:0}.steps p{margin:0 0 10px}
.qr-box svg{display:block;width:100%;height:auto;max-width:280px;margin:0 auto}
.g-side.sv1{grid-template-columns:1fr}

/* ---------- e-sports background ---------- */
:root{--es1:#DDEBFF;--es2:#FFF2C7;--esroad:#8C9BC0;--esline:#2F62D9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--es1:#0E1A3A;--es2:#1E1F3A;--esroad:#3A4A78;--esline:#7FA2FF}}
:root[data-theme="dark"]{--es1:#0E1A3A;--es2:#1E1F3A;--esroad:#3A4A78;--esline:#7FA2FF}
#esbg{position:fixed;inset:0;z-index:-1;pointer-events:none;display:none}
#esbg svg{width:100%;height:100%;display:block;opacity:.75}
body.es-bg #esbg{display:block}
body.es-bg{background:transparent}
body.es-bg main .note{background:color-mix(in srgb,var(--surface) 85%,transparent);border-radius:10px;padding:4px 10px;display:inline-block}
body.es-bg .es-board,body.es-bg main .panel{background:color-mix(in srgb,var(--surface) 95%,transparent)}


/* ---------- dodgeball kids illustration ---------- */
:root{--dodgeveil:linear-gradient(180deg,rgba(238,243,252,.15) 0%,rgba(238,243,252,.35) 50%,rgba(238,243,252,.55) 100%)}

body.tot-bg #totbg{display:block}
body.tot-bg{background:transparent}
body.tot-bg main .panel{background:color-mix(in srgb,var(--surface) 97%,transparent)}
body.tot-bg main .note,body.tot-bg main h2{background:color-mix(in srgb,var(--surface) 85%,transparent);border-radius:10px;padding:4px 10px;display:inline-block}
.token-box{border-color:var(--yellow);box-shadow:0 5px 0 var(--yellow);margin-bottom:16px}
.token-box input{font:inherit;font-size:16px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);min-width:0;flex:1}
/* ---------- custom background (this device only) ---------- */
.sheet.custom-bg::before{background:var(--bdveil),var(--custombg) center/cover no-repeat,var(--bg)!important}
.sheet.custom-bg::after{display:none}
.sheet.custom-bg .game,.sheet.custom-bg .result-line{background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
#esbg.custom-bg{background:var(--bdveil),var(--custombg) center/cover no-repeat,var(--bg)}
#esbg.custom-bg svg{display:none}
.bg-list{display:flex;flex-direction:column;gap:10px}
.bg-row{display:grid;grid-template-columns:72px 1fr auto;gap:12px;align-items:center}
.bg-thumb{width:72px;height:46px;border-radius:12px;border:2px solid var(--line);background:var(--bg) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.bg-btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.bg-btns .ghost{padding:7px 12px;font-size:14px}
@media (max-width:520px){.bg-row{grid-template-columns:72px 1fr}.bg-btns{grid-column:1 / -1;justify-content:flex-start}}
</style>

      toast("저장 공간이 가득 차 저장하지 못했습니다. 설정 탭에서 백업을 받은 뒤 알려 주세요.");
    } else {
      retries[path]=(retries[path]||0)+1;
      if(!pending[path]) pending[path]=data;
      if(retries[path]<=6){
        const base = code==="resource_exhausted" ? 4000 : 1500;
        setSync("저장 재시도 중");
        clearTimeout(timers[path]); timers[path]=setTimeout(()=>flush(path), base*retries[path] + Math.random()*800);
      } else {
        retries[path]=99; S.stalled=true;
        setSync("저장 대기 중 ("+code+")");
        toast("점수가 아직 저장되지 않았습니다 (오류: "+code+"). 입력한 내용은 화면에 남아 있고, 20초마다 자동으로 다시 저장을 시도합니다.");
      }
    }
  }
  finally{ inflight[path]=false; if(pending[path] && !(retries[path]>0)) flush(path); }
}

function isAdminDevice(){

function makeSheetDb(url){
  const docSubs={}, colSubs={}; let cache={}; let lastRaw="";
  function emit(){
    Object.keys(docSubs).forEach(path=>{ const v=cache[path]; docSubs[path]({exists:v!==undefined, data:()=>v}); });
    Object.keys(colSubs).forEach(col=>{ const docs=Object.keys(cache).filter(k=>k.startsWith(col+"/")).map(k=>({id:k.slice(col.length+1), data:()=>cache[k]})); colSubs[col]({docs}); });
  }
  async function pull(){
    const r=await fetch(url+(url.includes("?")?"&":"?")+"action=all&t="+Date.now());
    const j=await r.json(); if(!j.ok) throw new Error(j.error||"sheet");
    const raw=JSON.stringify(j.docs||{}); if(raw===lastRaw) return; lastRaw=raw;
    cache=j.docs||{}; emit();
  }
  return {
    pull, emit,
    doc(path){ return {
      set: async (data)=>{
        const r=await fetch(url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({token:sheetToken(),key:path,value:data})});
        let j; try{ j=await r.json(); }catch(e){ const er=new Error("bad response"); er.code="unavailable"; throw er; }
        if(!j.ok){ const er=new Error(j.error); er.code = j.error==="bad_token" ? "bad_token" : "unavailable"; throw er; }
        cache[path]=JSON.parse(JSON.stringify(data)); lastRaw=JSON.stringify(cache);
      },
      onSnapshot(fn){ docSubs[path]=fn; return ()=>{ delete docSubs[path]; }; }
    }; },
    collection(col){ return { onSnapshot(fn){ colSubs[col]=fn; return ()=>{ delete colSubs[col]; }; } }; }
  };
}

/* ---------- schedule (round robin, circle method) ---------- */
function schedule(n){
  const t=[]; for(let i=1;i<=n;i++) t.push(i);
  if(n%2) t.push(0);
  const m=t.length, rounds=[];
  for(let r=0;r<m-1;r++){
    const pairs=[];
    for(let i=0;i<m/2;i++){
      const x=t[i], y=t[m-1-i];
      if(x&&y) pairs.push(x<y?[x,y]:[y,x]);
    }
    rounds.push(pairs);
    t.splice(1,0,t.pop());
  }
  return rounds;
}
function mid(sport,g,a,b){ return sport+"_"+g+"_"+a+"_"+b; }

/* ---------- dodgeball logic ---------- */
function blank(v){ return v===undefined||v===null||v===""; }
function has(s,k){ return !blank(s[k]) || s[k+"B"]!==undefined; }
function sv(s,k){ if(!blank(s[k])) return num(s[k],0); if(s[k+"B"]!==undefined) return num(s[k+"B"],0)+num(s[k+"G"],0); return 0; }
function newSet(){ return {a:null,b:null,pick:null}; }
function newTimer(){ return {running:false,endsAt:0,left:S.config.setMinutes*60000}; }
function filled(s){ return has(s,"a") && has(s,"b"); }
function setDone(s){ return filled(s) && s.done===true; }
function previewWinner(s){ if(!filled(s)) return null; const A=sv(s,"a"), B=sv(s,"b"); if(A>B) return "a"; if(B>A) return "b"; return s.pick||null; }
function setWinner(s){ return setDone(s) ? previewWinner(s) : null; }
function dodgeSummary(m){
  let wa=0,wb=0,sa=0,sb=0,started=false;
  (m&&m.sets||[]).forEach(s=>{
    if(setDone(s)){ const w=setWinner(s); if(w==="a") wa++; if(w==="b") wb++; sa+=sv(s,"a"); sb+=sv(s,"b"); }
    if(has(s,"a") || has(s,"b")) started=true;
  });
  if(m && m.timer && m.timer.running) started=true;
  const winner = wa>=2?"a":wb>=2?"b":null;
  return {wa,wb,sa,sb,winner,status: winner?"done":(started?"live":"todo")};
}

/* ---------- badminton logic ---------- */
function gameState(a,b){
  a=num(a,0); b=num(b,0);
  const hi=Math.max(a,b), lo=Math.min(a,b);
  if(a===0&&b===0) return {st:"empty"};
  if(hi>30 || (hi>21 && hi-lo>2) || (hi===30 && lo<28)) return {st:"invalid", why: hi>30?"최고 점수는 30점입니다.":"21점을 넘긴 경기는 2점 차가 나는 순간 끝납니다."};
  if((hi===21 && lo<=19) || (hi>21 && hi-lo===2) || (hi===30 && lo===29)) return {st:"final", w: a>b?"a":"b"};
  return {st:"progress"};
}
function bdOutcome(g){
  const r=gameState(g.a,g.b), A=num(g.a,0), B=num(g.b,0);
  if(r.st==="final") return r.w;
  if(r.st==="progress" && A!==B) return A>B?"a":"b";
  return null;
}
function bdSummary(m){
  let ga=0,gb=0,pa=0,pb=0,fin=0,started=false;
  (m&&m.games||[]).forEach(g=>{
    const r=gameState(g.a,g.b);
    if(r.st!=="empty") started=true;
    const w = g.done ? bdOutcome(g) : null;
    if(w){ fin++; if(w==="a") ga++; else gb++; pa+=num(g.a,0); pb+=num(g.b,0); }
  });
  const done = fin===BD_EVENTS.length;
  return {ga,gb,pa,pb,fin,winner: done?(ga>gb?"a":"b"):null, status: done?"done":(started?"live":"todo")};
}
function newBd(){ return BD_EVENTS.map(()=>({a:0,b:0,pa:"",pb:""})); }

/* ---------- standings ---------- */
function standings(sport,g){
  const n=S.config.classes[g]||0, rows={};
  for(let i=1;i<=n;i++) rows[i]={c:i,p:0,w:0,l:0,f1:0,a1:0,f2:0,a2:0};
  let total=0, done=0;
  schedule(n).forEach(r=>r.forEach(([a,b])=>{
    total++;
    const m=S.matches[mid(sport,g,a,b)];
    const s = sport==="dodge"?dodgeSummary(m):bdSummary(m);
    if(s.status!=="done") return;
    done++;
    const A=rows[a], B=rows[b]; A.p++; B.p++;
    if(s.winner==="a"){A.w++;B.l++;} else {B.w++;A.l++;}
    if(sport==="dodge"){ A.f1+=s.wa;A.a1+=s.wb;B.f1+=s.wb;B.a1+=s.wa; A.f2+=s.sa;A.a2+=s.sb;B.f2+=s.sb;B.a2+=s.sa; }
    else { A.f1+=s.ga;A.a1+=s.gb;B.f1+=s.gb;B.a1+=s.ga; A.f2+=s.pa;A.a2+=s.pb;B.f2+=s.pb;B.a2+=s.pa; }
  }));
  const list=Object.values(rows);
  const key=r=>[r.w, r.f1-r.a1, r.f2-r.a2];
  list.sort((x,y)=>{ const a=key(x),b=key(y); for(let i=0;i<3;i++) if(a[i]!==b[i]) return b[i]-a[i]; return x.c-y.c; });
  assignRanks(list, r=>key(r).join("|"));
  return {list,total,done};
}
function assignRanks(list, keyFn){
  let prev=null, rank=0;
  list.forEach((r,i)=>{ const k=keyFn(r); if(k!==prev){ rank=i+1; prev=k; } r.rank=rank; });
  list.forEach(r=>{ r.tied = list.filter(x=>x.rank===r.rank).length>1; r.pts = rankPoints(r.rank); });
}
function rankPoints(rank){ const p=S.config.points; return rank>=1&&rank<=p.length ? num(p[rank-1],0) : num(S.config.otherPoints,0); }
function esPoints(g){
  const n=S.config.classes[g]||0, d=(S.esports[g]&&S.esports[g].points)||{}, out={};
  for(let i=1;i<=n;i++){ out[i]= blank(d[i]) ? null : num(d[i],0); }
  return out;
}
function esRanks(g){
  const n=S.config.classes[g]||0, pts=esPoints(g), out={};
  const entered=Object.keys(pts).filter(c=>pts[c]!==null);
  if(entered.length){
    for(let i=1;i<=n;i++) out[i]=null;
    entered.forEach(c=>{ out[c]=1+entered.filter(o=>pts[o]<pts[c]).length; });
    return out;
  }
  const d=(S.esports[g]&&S.esports[g].ranks)||{};
  for(let i=1;i<=n;i++){ const r=num(d[i],0); out[i]= r>0?r:null; }
  return out;
}

function renderLeague(sport){
  const g=UI.grade, n=S.config.classes[g]||0;
  if(n<2){ $main.innerHTML=`<div class="panel empty">${g}학년 학급 수가 2개 이상이어야 리그를 만들 수 있습니다. 설정 탭에서 학급 수를 입력하세요.</div>`; return; }
  const st=standings(sport,g);

function matchCard(sport,g,a,b){
  const id=mid(sport,g,a,b), m=S.matches[id];
  const s = sport==="dodge"?dodgeSummary(m):bdSummary(m);
  const score = sport==="dodge" ? (s.status==="todo"?"vs":`${s.wa} : ${s.wb}`) : (s.status==="todo"?"vs":`${s.ga} : ${s.gb}`);
  const badge = s.status==="done"?`<span class="badge done">종료</span>`:s.status==="live"?`<span class="badge live">진행 중</span>`:`<span class="badge">예정</span>`;
  return `<button class="mcard" data-open="${id}" aria-label="${cls(a)} 대 ${cls(b)} 점수 입력">

function esBoardHtml(g){

  const left=n-list.length;
  if(!list.length) return `<div class="empty">그랑프리 순위를 입력하면 반 순위가 바로 나옵니다.</div>`;
  const tie=list.some(c=>list.filter(o=>r[o]===r[c]).length>1);

function buildHtml(){
  const snap=Object.assign(payload(S),{publishedAt:Date.now(), publicUrl:(S.config.publicUrl||"").trim()});
  const json=JSON.stringify(snap).replace(/</g,"\u003c");
  const head=OWN.filter(o=>o.head).map(o=>o.html).join("\n");
  const body=OWN.filter(o=>!o.head).map(o=>o.id==="snapshot"?'<script type="application/json" id="snapshot" data-own>'+json+'<\/script>':o.html).join("\n");
  return "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n"+head+"\n</head>\n<body>\n"+body+"\n</body>\n</html>\n";
}
async function getDl(){
  let dl=null; try{ dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; }catch(e){ dl=null; }
  if(dl) return dl;
  return { save: async ({filename,data})=>{ const blob=data instanceof Blob?data:new Blob([data]); const u=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),3000); return {status:"saved"}; } };
}
async function exportFile(btn){
  const dl=await getDl(); if(!dl){ toast("이 화면에서는 파일을 받을 수 없습니다."); return; }
  Object.keys(pending).forEach(p=>{ clearTimeout(timers[p]); flush(p); });
  btn.disabled=true;
  try{
    await dl.save({filename:"index.html", data:new Blob([buildHtml()],{type:"text/html"})});
    S.config.exportedAt=Date.now(); S.config.exportedHash=dataHash(); S.config.exportedUrl=(S.config.publicUrl||"").trim(); saveConfig(); render();
    toast("결과 파일을 받았습니다. 같은 곳에 다시 올리세요.");
  }catch(e){ btn.disabled=false; if(e&&e.code==="declined") return; toast(e&&e.code==="rate_limited"?"잠시 뒤 다시 누르세요.":"파일을 받지 못했습니다."); }
}
async function exportQr(){
  const url=(S.config.publicUrl||"").trim(); if(!url) return;
  const dl=await getDl(); if(!dl){ toast("이 화면에서는 파일을 받을 수 없습니다."); return; }
  qrcode.stringToBytes = qrcode.stringToBytesFuncs["UTF-8"];
  const q=qrcode(0,"M"); q.addData(url); q.make();
  const n=q.getModuleCount(), cell=Math.floor(900/(n+4)), size=cell*(n+4), W=size+120, H=size+260;
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H; const x=cv.getContext("2d");
  x.fillStyle="#fff"; x.fillRect(0,0,W,H); x.fillStyle="#14233D"; x.textAlign="center";
  x.font='64px "Jua", "Malgun Gothic", sans-serif'; x.fillText("경기 결과 확인",W/2,110);
  x.fillStyle="#000"; const ox=60, oy=160;
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(q.isDark(r,c)) x.fillRect(ox+(c+2)*cell, oy+(r+2)*cell, cell, cell);

}

/* ---------- scoring sheet ---------- */
const $sheet=document.getElementById("sheet"), $sb=document.getElementById("sheetBody");
function openMatch(id){
  UI.open=id;
  const [sport,g,a,b]=id.split("_");
  if(!S.matches[id]){
    S.matches[id] = sport==="dodge" ? {sport,grade:g,a:+a,b:+b,sets:[newSet(),newSet(),newSet()]} : {sport,grade:g,a:+a,b:+b,games:newBd()};

  $sheet.classList.toggle("dodge-bg", sport==="dodge");
  $sheet.classList.toggle("bd-bg", sport==="bd");
  applyCustomBg($sheet, sport);
  $sheet.classList.add("open"); document.body.style.overflow="hidden";
  renderSheet(); document.getElementById("closeSheet").focus();
}
function closeSheet(){ UI.open=null; $sheet.classList.remove("open"); document.body.style.overflow=""; render(); }
function renderSheet(fromRemote){
  if(!UI.open) return;
  if(fromRemote && $sb.contains(document.activeElement) && document.activeElement.tagName==="INPUT") return;
  const m=S.matches[UI.open]; if(!m) return;
  try{
    if(Object.isFrozen(m) || (m.sets&&Object.isFrozen(m.sets)) || (m.games&&Object.isFrozen(m.games)) || (m.timer&&Object.isFrozen(m.timer))) S.matches[UI.open]=clone(m);
    const mm=S.matches[UI.open];
    if(mm.sport==="dodge") renderDodge(mm); else renderBd(mm);
  }catch(err){
    $sb.innerHTML=`<div class="panel empty">점수판을 여는 중 문제가 생겼습니다. 닫고 다시 열어 주세요.<br><small>${esc(err&&err.message||err)}</small></div>`;
    return;
  }
  if(S.ro){
    $sb.querySelectorAll("input,select").forEach(el=>{ el.disabled=true; });
    if(S.mode==="db" && !S.preview && !S.sheet) $sb.insertAdjacentHTML("afterbegin",`<div class="ro-note">🔒 이 계정은 보기 권한만 있어 점수를 입력할 수 없습니다. 페이지 주인에게 "편집 가능" 이상의 권한을 받아 주세요.</div>`);

}

function setResHtml(m,i){

  if(setDone(s)){
    const w=setWinner(s);

  }
  if(!filled(s)){
    const two=dodgeSummary({sets:m.sets.slice(0,2)});
    if(i===2 && Math.max(two.wa,two.wb)>=2) return `<span class="muted">2세트로 승부가 났습니다. 3세트를 했다면 입력하세요.</span>`;
    if(has(s,"a")||has(s,"b")) return `<span class="muted">${has(s,"a")?cls(m.b):cls(m.a)}의 남은 인원도 입력하세요.</span>`;

  return `<span class="warnt">남은 인원이 ${A}명으로 같습니다. ${S.ro?"판정을 기다리는 중입니다.":"판정으로 이긴 반을 고른 뒤 경기 종료를 누르세요."}</span>
    <span class="pick-row"><button class="pickA" data-pick="a" data-si="${i}">${cls(m.a)} 승</button><button class="pickB" data-pick="b" data-si="${i}">${cls(m.b)} 승</button></span>`;

function setCtlHtml(m,i){

function matchLineText(m){
  const sum=dodgeSummary(m);
  if(sum.winner) return `경기 종료: ${cls(sum.winner==="a"?m.a:m.b)} 승리, 세트 스코어 ${sum.wa} : ${sum.wb}`;
  if(sum.status==="todo") return `경기 전입니다. 남은 인원을 입력하면 결과가 바로 나옵니다. 2세트를 먼저 이긴 반이 승리합니다.`;
  const st = sum.wa===sum.wb ? "동률" : `${cls(sum.wa>sum.wb?m.a:m.b)} 앞섬`;
  return `진행 중: 세트 스코어 ${sum.wa} : ${sum.wb} ${st}${sum.wa===1&&sum.wb===1?", 3세트로 승부를 가립니다":""}`;
}
function renderDodge(m){
  while(m.sets.length<3) m.sets.push(newSet());
  if(!m.timer) m.timer=newTimer();
  if(!m.timer.running && m.timer.left>S.config.setMinutes*60000) m.timer.left=S.config.setMinutes*60000;
  const sum=dodgeSummary(m);
  const row=(s,i)=>{
    const inp=(k,c)=>`<div class="g-side ${k.toUpperCase()} sv1" data-name="${cls(c)} 남은 인원"><input type="number" min="0" max="99" inputmode="numeric" placeholder="–" data-sv="${k}" data-si="${i}" value="${has(s,k)?sv(s,k):""}" ${setDone(s)?"disabled":""} aria-label="${i+1}세트 ${cls(c)} 남은 인원"></div>`;
    return `<div class="game ${setDone(s)?"is-done":""}" data-card="${i}"><div class="game-top"><span class="ev">${i+1}세트</span><span class="ctl" data-ci="${i}">${setCtlHtml(m,i)}</span></div>
      <div class="g-names"><span>${cls(m.a)} 남은 인원</span><span></span><span>${cls(m.b)} 남은 인원</span></div>
      <div class="g-row sv-row">${inp("a",m.a)}<span class="g-colon">:</span>${inp("b",m.b)}</div>
      <div class="g-res set-res" data-ri="${i}">${setResHtml(m,i)}</div></div>`;
  };
  $sb.innerHTML=`<div class="timer-panel">
      <div class="tl">세트 타이머 (${S.config.setMinutes}분)</div>
      <div class="clock" id="clock" role="timer">${fmtT(timeLeft(m.timer))}</div>
      <div class="tbar" aria-hidden="true"><i id="tbar" style="width:${barPct(m.timer)}%"></i></div>
      <div class="tbtns"><button class="go" data-timer="toggle">${m.timer.running?"일시정지":(m.timer.left<=0?"다시 시작":"시작")}</button><button class="rs" data-timer="reset">${S.config.setMinutes}:00으로 초기화</button></div>
    </div>
    <div class="board">
      <div class="side A"><div class="nm disp">${cls(m.a)}</div><div class="big" id="dwa">${sum.wa}</div><div class="lbl">이긴 세트</div></div>
      <div class="vs">:</div>
      <div class="side B"><div class="nm disp">${cls(m.b)}</div><div class="big" id="dwb">${sum.wb}</div><div class="lbl">이긴 세트</div></div>
    </div>
    <p class="result-line ${sum.winner?"won":""}" id="dres" aria-live="polite">${matchLineText(m)}</p>
    <div class="games">${m.sets.slice(0,3).map(row).join("")}</div>
    <p class="note">세트마다 ${S.config.setMinutes}분이 끝나면(알림음이 울립니다) 두 반의 남은 인원을 입력하세요. 남은 인원이 많은 반이 그 세트를 이깁니다.</p>`;
}
function updateDodgeInfo(m){
  const sum=dodgeSummary(m);
  const a=document.getElementById("dwa"), b=document.getElementById("dwb"), r=document.getElementById("dres");
  if(a) a.textContent=sum.wa; if(b) b.textContent=sum.wb; if(r){ r.textContent=matchLineText(m); r.classList.toggle("won",!!sum.winner); }
  $sb.querySelectorAll(".set-res").forEach(el=>{ el.innerHTML=setResHtml(m,+el.dataset.ri); });
}
function timeLeft(t){ return t.running ? Math.max(0, t.endsAt-Date.now()) : Math.max(0,t.left); }
function fmt(ms){ const neg=ms<0; ms=Math.abs(ms); const s=Math.ceil(ms/1000); return (neg?"+":"")+Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
function fmtT(ms){ if(ms<=0) return "종료"; if(ms<10000){ return "0:"+String(Math.floor(ms/1000)).padStart(2,"0")+"."+Math.floor(ms%1000/100); } return fmt(ms); }
function barPct(t){ const full=S.config.setMinutes*60000; return Math.max(0,Math.min(100, timeLeft(t)/full*100)); }
let AC=null, rung="";
function ensureAudio(){ try{ AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.resume) AC.resume(); }catch(e){ AC=null; } }
function beep(n,freq,len){ if(!AC) return; try{ for(let i=0;i<n;i++){ const o=AC.createOscillator(), g=AC.createGain(), t0=AC.currentTime+i*(len+0.12); o.type="square"; o.frequency.value=freq; o.connect(g); g.connect(AC.destination); g.gain.setValueAtTime(0.0001,t0); g.gain.exponentialRampToValueAtTime(0.25,t0+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t0+len); o.start(t0); o.stop(t0+len+0.02); } }catch(e){} }
let lastSec=-1;
setInterval(()=>{
  const el=document.getElementById("clock"); if(!el||!UI.open) return;
  const m=S.matches[UI.open]; if(!m||m.sport!=="dodge"||!m.timer) return;
  const t=timeLeft(m.timer);
  el.textContent = fmtT(t);
  el.classList.toggle("over", t<=0); el.classList.toggle("last", t>0 && t<10000);
  const bar=document.getElementById("tbar"); if(bar) bar.style.width=barPct(m.timer)+"%";
  if(m.timer.running){
    const sec=Math.ceil(t/1000);
    if(sec!==lastSec && sec>0 && sec<=3){ beep(1,660,0.12); }
    lastSec=sec;
    const key=UI.open+":"+m.timer.endsAt;
    if(t<=0 && rung!==key){ rung=key; beep(3,880,0.35); if(navigator.vibrate) try{ navigator.vibrate([300,150,300]); }catch(e){} toast("세트 시간이 끝났습니다. 남은 인원을 입력하세요."); }
  }
}, 100);

function bdResHtml(m,i){
  const gm=m.games[i], r=gameState(gm.a,gm.b), A=num(gm.a,0), B=num(gm.b,0);
  const hi=Math.max(A,B), lo=Math.min(A,B);
  if(gm.done){ const w=bdOutcome(gm); if(w) return `<span class="ok">결과 반영됨: ${cls(w==="a"?m.a:m.b)} 승, ${hi}점 대 ${lo}점 (${hi-lo}점 차)${r.st==="final"?"":", 21점 전 종료"}</span>`; }
  if(r.st==="final"){ const w=r.w==="a"?m.a:m.b; return `<span class="live-t">${cls(w)} 승, ${hi}점 대 ${lo}점 (${hi-lo}점 차). 경기 종료를 누르면 결과에 반영됩니다.</span>`; }
  if(r.st==="invalid") return `<span class="warnt">점수를 확인하세요. ${r.why}</span>`;
  if(r.st==="empty") return `<span class="muted">경기 전</span>`;
  const lead=A>B?m.a:m.b;
  let t = A===B ? `진행 중 ${A} : ${B}, 동점` : `진행 중 ${A} : ${B}, ${cls(lead)} ${hi-lo}점 앞섬`;
  if(A===B && A>=20) t+=" (듀스: 2점 차가 나야 끝납니다)";
  else if(hi>=20 && hi>lo) t+=` (${cls(lead)} 게임 포인트)`;
  return `<span class="live-t">${t}</span>`;
}
function bdCtlHtml(m,i){
  const gm=m.games[i];

    const open = e.sp==="es" ? `data-goes="${e.g}"` : `data-open="${e.key}"`;
    return `${head}<button class="sched-row" ${open}>
      <span class="gpill">${e.g}학년</span><span class="sr-sport">${e.ic} ${e.nm}</span>
      <span class="sr-label">${e.label}${schedExtra(e.key)}</span>
      <span class="sr-st">${stt.txt?`<b>${stt.txt}</b>`:""}${badge}</span></button>`;
  }).join("");
  $main.innerHTML=`<section class="sched-wrap">
    <div class="sched-top"><h2>📅 리그 일정</h2>
      ${canEdit?`<div class="actions" style="margin:0">${editing?`<button class="ghost" data-sched-reset>계획서 일정으로 되돌리기</button><button class="primary" data-sched-edit>수정 끝내기</button>`:`<button class="primary" data-sched-edit>✏️ 일정 수정</button>`}</div>`:""}
    </div>
    ${hl}
    <div class="pills">${pills}</div>
    ${editing?`<p class="note">바꾼 내용은 바로 저장됩니다. 날짜를 비우면 "날짜 미정"으로 표시됩니다. "수정 끝내기"를 누르면 날짜 순서로 다시 정렬됩니다.</p>`:`<p class="note">경기를 누르면 결과를 볼 수 있습니다. 일정은 상황에 따라 바뀔 수 있습니다.</p>`}
    <div class="sched-list">${rows||'<div class="empty">일정이 없습니다.</div>'}</div>
    ${editing&&S.schedResetAsk?`<div class="ro-note" style="margin-top:12px">바꾼 날짜·시간·장소·메모를 모두 지우고 계획서 일정으로 되돌립니다.<div class="actions" style="margin-top:10px"><button class="primary" data-sched-reset-yes>되돌리기</button><button class="ghost" data-sched-reset-no>취소</button></div></div>`:""}
  </section>`;
}
function commitSched(t){
  const key=t.dataset.schKey, f=t.dataset.schF;
  const sc=clone(S.config.schedule||{}); const cur=Object.assign({},sc[key]||{});
  const v=(t.value||"").trim();
  if((cur[f]||"")===v) return;
  if(v) cur[f]=v; else delete cur[f];
  sc[key]=cur; S.config.schedule=sc; saveConfig();
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const t=e.target.closest("button"); if(!t) return;
  if(t.dataset.grade){ UI.grade=t.dataset.grade; render(); return; }
  if(t.dataset.tab){ UI.tab=t.dataset.tab; render(); return; }
  if(t.hasAttribute("data-export")){ exportFile(t); return; }
  if(t.hasAttribute("data-save-csv")){ exportCsv(); return; }
  if(t.hasAttribute("data-token-save")){ const v=(document.getElementById("tokenIn")||{}).value||""; if(!v.trim()){ toast("비밀번호를 입력해 주세요."); return; } try{ localStorage.setItem(TOKEN_KEY,v.trim()); }catch(e){} S.needToken=false; render(); toast("저장했습니다. 이제 점수가 구글 시트에 저장됩니다."); Object.keys(pending).forEach(pth=>{ clearTimeout(timers[pth]); retries[pth]=0; flush(pth); }); return; }
  if(t.hasAttribute("data-token-reset")){ try{ localStorage.removeItem(TOKEN_KEY); }catch(e){} S.needToken=true; render(); return; }
  if(t.dataset.bgpick){ const f=document.querySelector(`input[data-bgfile="${t.dataset.bgpick}"]`); if(f){ f.value=""; f.click(); } return; }
  if(t.dataset.bgclear){ try{ localStorage.removeItem("gokseon-bg-"+t.dataset.bgclear); }catch(e){} toast("기본 배경으로 되돌렸습니다."); render(); return; }
  if(t.dataset.schedF){ UI.schedFilter=t.dataset.schedF; render(); return; }
  if(t.hasAttribute("data-sched-edit")){ UI.schedEdit=!UI.schedEdit; S.schedResetAsk=false; render(); return; }
  if(t.hasAttribute("data-sched-reset")){ S.schedResetAsk=true; render(); return; }
  if(t.hasAttribute("data-sched-reset-no")){ S.schedResetAsk=false; render(); return; }
  if(t.hasAttribute("data-sched-reset-yes")){ S.schedResetAsk=false; S.config.schedule=clone(PLAN_SCHEDULE); saveConfig(); render(); toast("계획서 일정으로 되돌렸습니다."); return; }
  if(t.dataset.goes){ UI.grade=t.dataset.goes; UI.tab="es"; render(); window.scrollTo(0,0); return; }
  if(t.hasAttribute("data-ghjson")){ exportDataJson(); return; }
  if(t.hasAttribute("data-admin-off")){ try{ localStorage.removeItem(ADMIN_KEY); }catch(e){} location.href=location.pathname; return; }
  if(t.hasAttribute("data-import-yes")){ applyImport(); return; }
  if(t.hasAttribute("data-import-no")){ S.pendingImport=null; render(); return; }
  if(t.hasAttribute("data-save-json")){ exportJson(); return; }
  if(t.hasAttribute("data-load-json")){ const f=document.getElementById("backupFile"); if(f){ f.value=""; f.click(); } return; }
  if(t.hasAttribute("data-qrimg")){ exportQr(); return; }
  if(t.hasAttribute("data-preview")){ S.preview=true; setRO(true); window.scrollTo(0,0); render(); return; }
  if(t.hasAttribute("data-endpreview")){ S.preview=false; setRO(!S.canWrite); render(); toast("편집 화면으로 돌아왔습니다."); return; }
  if(t.dataset.open){ openMatch(t.dataset.open); return; }
  if(t.id==="closeSheet"){ closeSheet(); return; }
  const id=UI.open; if(!id) return; const m=S.matches[id];
  if(m.sport==="dodge"){
    if(S.ro) return;
    if(t.dataset.timer){
      if(!m.timer) m.timer=newTimer();
      const tm=m.timer;
      if(t.dataset.timer==="toggle"){ ensureAudio(); if(tm.running){ tm.left=Math.max(0,tm.endsAt-Date.now()); tm.running=false; } else { if(tm.left<=0) tm.left=S.config.setMinutes*60000; tm.endsAt=Date.now()+tm.left; tm.running=true; } }
      else { tm.running=false; tm.left=S.config.setMinutes*60000; }
      saveMatch(id); renderSheet(); return;
    }
    if(t.dataset.endSet!==undefined){
      flushFocused(m);
      const s=m.sets[+t.dataset.endSet];
      if(!filled(s)){ toast("두 반의 남은 인원을 모두 입력한 뒤 눌러 주세요."); return; }
      if(!previewWinner(s)){ toast("남은 인원이 같습니다. 이긴 반을 먼저 고른 뒤 눌러 주세요."); return; }
      s.done=true; saveMatch(id); renderSheet();
      const sum=dodgeSummary(m);
      toast(sum.winner?`경기 종료: ${cls(sum.winner==="a"?m.a:m.b)} 승리 (세트 ${sum.wa} : ${sum.wb})`:`${+t.dataset.endSet+1}세트 결과를 반영했습니다.`);
      return;
    }
    if(t.dataset.reopenSet!==undefined){ m.sets[+t.dataset.reopenSet].done=false; saveMatch(id); renderSheet(); return; }
    if(t.dataset.pick!==undefined && t.dataset.si!==undefined){ m.sets[+t.dataset.si].pick=t.dataset.pick||null; saveMatch(id); updateDodgeInfo(m); return; }
  } else if(!S.ro && t.dataset.endGame!==undefined){
    flushFocused(m);
    const gm=m.games[+t.dataset.endGame];
    if(!bdOutcome(gm)){ const r=gameState(gm.a,gm.b); toast(r.st==="empty"?"점수를 먼저 입력한 뒤 눌러 주세요.":r.st==="invalid"?"점수를 확인하세요. "+r.why:"동점에서는 경기를 끝낼 수 없습니다."); return; }
    gm.done=true; saveMatch(id); renderSheet();
    const sum=bdSummary(m);
    toast(sum.winner?`경기 종료: ${cls(sum.winner==="a"?m.a:m.b)} 승리 (게임 ${sum.ga} : ${sum.gb})`:`${BD_EVENTS[+t.dataset.endGame].name} 결과를 반영했습니다.`);
  } else if(!S.ro && t.dataset.reopenGame!==undefined){
    m.games[+t.dataset.reopenGame].done=false; saveMatch(id); renderSheet();
  } else if(!S.ro && t.dataset.bd!==undefined){
    const gm=m.games[+t.dataset.bd], k=t.dataset.k; if(gm.done) return;
    gm[k]=Math.min(30,Math.max(0,num(gm[k],0)+(+t.dataset.d)));
    const inp=$sb.querySelector(`[data-bdin="${t.dataset.bd}"][data-k="${k}"]`); if(inp) inp.value=gm[k];
    saveMatch(id); updateBdInfo(m);
  }
});
document.addEventListener("change",e=>{
  const t=e.target; if(S.ro) return;
  if(t.dataset.bgfile){ if(t.files&&t.files[0]) loadBgFile(t.files[0],t.dataset.bgfile); return; }
  if(t.id==="backupFile"){ if(t.files&&t.files[0]) importJson(t.files[0]); return; }
  if(t.hasAttribute("data-cfg-url")){ let v=t.value.trim(); if(v && !/^https?:\/\//i.test(v)) v="https://"+v; S.config.publicUrl=v; t.value=v; saveConfig(); const card=document.querySelector(".qr-card"); if(card) card.innerHTML=qrCardHtml(); return; }
  if(t.dataset.esp!==undefined){ commitEs(t); return; }
  if(t.dataset.schF!==undefined){ commitSched(t); return; }
  if(t.dataset.es){
    const g=UI.grade; S.esports[g]=S.esports[g]||{ranks:{}}; S.esports[g].ranks=Object.assign({},S.esports[g].ranks);
    S.esports[g].ranks[t.dataset.es]= t.value?+t.value:0; saveEs(g); render(); return;
  }
  if(t.dataset.cfg){
    const [k,sub]=t.dataset.cfg.split("."); let v=Math.max(0,num(t.value,0));
    if(k==="classes") v=Math.min(20,v);
    if(k==="setMinutes") v=Math.max(1,v);
    if(sub!==undefined){ if(k==="points") S.config.points[+sub]=v; else S.config[k][sub]=v; } else S.config[k]=v;
    saveConfig(); toast("설정을 저장했습니다."); return;
  }
  const id=UI.open; if(!id) return; const m=S.matches[id];
  if(t.dataset.sv){ if(commitSv(m,t)){ saveMatch(id); updateDodgeInfo(m); } return; }
  if(t.dataset.bdin!==undefined){ if(commitBd(m,t)){ saveMatch(id); updateBdInfo(m); } if(t.value==="") t.value=0; }
});
document.addEventListener("input",e=>{
  const t=e.target; if(S.ro || !t.dataset) return;
  if(t.dataset.schF!==undefined){ commitSched(t); return; }
  if(t.dataset.esp!==undefined){ commitEs(t); return; }
  if(!UI.open) return;
  const m=S.matches[UI.open]; if(!m) return;
  if(t.dataset.sv){ if(commitSv(m,t)){ saveMatch(UI.open); updateDodgeInfo(m); } }
  else if(t.dataset.bdin!==undefined && t.value!==""){ if(commitBd(m,t)){ saveMatch(UI.open); updateBdInfo(m); } }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&UI.open) closeSheet(); });

function commitSv(m,t){ const s=m.sets[+t.dataset.si], k=t.dataset.sv; if(!s || s.done) return false;
  const nv = blank(t.value)?null:Math.min(99,Math.max(0,num(t.value,0)));
  const ov = has(s,k)?sv(s,k):null;
  if(nv===ov && s[k+"B"]===undefined) return false;
  s[k]=nv; delete s[k+"B"]; delete s[k+"G"]; s.pick=null; return true; }
let toastT; function toast(m){ const el=document.getElementById("toast"); el.textContent=m; el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>el.classList.remove("show"),2600); }

initDb();
})();
</script>
</body>
</html>
